name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 포트폴리오는 사이트 루트(/)에, 기존 MkDocs 노트는 /pokemonred/ 에 둡니다.
      - name: Assemble site
        run: |
          mkdir -p _site/pokemonred
          cp -r portfolio/. _site/
          cp -r pokemonred/site/. _site/pokemonred/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
